[package]
name = "ansible-inline-vault-viewer"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5.17", features = ["derive"] }
serde = "1.0.210"
serde_yaml = "0.9.34"
serde_derive = "1.0.210"
toml = "0.8.19"
anyhow = "1.0.87"
log = "0.4.22"
regex = { version = "1.10.6", features = [] }
log4rs = "1.3.0"
shellexpand = "3.1.0"
lazy_static = "1.5.0"
ansible-vault = "0.2.1"
md5 = "0.7.0"