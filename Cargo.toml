[package]
name = "ansible-inline-vault-viewer"
version = "0.1.5"
edition = "2021"
authors = ["Enrico Falanga <enrico.falanga@optionfactory.net>"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap-verbosity-flag = "2.2"
serde = "1.0"
serde_yaml = "0.9"
serde_derive = "1.0"
toml = "0.8"
anyhow = "1.0"
log = "0.4"
regex = { version = "1.10", features = [] }
log4rs = "1.3"
shellexpand = "3.1"
lazy_static = "1.5"
ansible-vault = "0.2"
md5 = "0.7"
walkdir = "2.5"