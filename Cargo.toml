[package]
name = "ansible-inline-vaulter"
version = "0.3.1"
edition = "2021"
authors = ["Enrico Falanga <enrico.falanga@optionfactory.net>"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap-verbosity-flag = "2.2"
serde_yaml = "0.9"
anyhow = "1.0"
log = "0.4"
regex = { version = "1.11", features = [] }
log4rs = "1.3"
shellexpand = "3.1"
lazy_static = "1.5"
ansible-vault = "0.2"
md5 = "0.7"
walkdir = "2.5"
colored = "2.1"
    uuid = { version = "1.20.0", features = ["v4"] }
ratatui = "0.30.0"
crossterm = "0.29.0"
