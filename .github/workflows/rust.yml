name: Rust

on:
  workflow_dispatch:
  release:
    types:
      - published

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Install rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
      - name: Build
        run: cargo build --release
      - name: Run tests
        run: cargo test --verbose
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: ansible-inline-vault-viewer
          path: target/release/ansible-inline-vault-viewer
